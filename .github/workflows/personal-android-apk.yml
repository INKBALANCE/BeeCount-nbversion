name: Personal APK

# 个人自用构建：只产出可直接安装的 APK，不发布、不上架。
# 触发方式：Actions 页面手动运行，或 push 到 personal 分支，或打 p* tag。

on:
  workflow_dispatch:
  push:
    branches: [personal]
    tags: ['p*']

env:
  FLUTTER_VERSION: '3.27.3'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 签名：把 keystore 的 base64 与三个口令放进仓库 Secrets。
      # 没配 Secrets 时会退化为 Gradle 的临时 CI keystore，装得上但每次签名都不同，
      # 无法覆盖安装旧版本 —— 正式自用请务必配好 Secrets。
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/ci-release.keystore
            {
              echo "storeFile=ci-release.keystore"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            } > android/key.properties
            echo "签名配置已写入（使用仓库 Secrets）"
          else
            echo "::warning::未配置签名 Secrets，本次产物不可用于覆盖升级"
          fi

      - name: Build APK
        run: |
          export CI_VERSION='personal'
          export GIT_COMMIT="${GITHUB_SHA::8}"
          export BUILD_TIME="$(date +%Y%m%d%H%M)"
          flutter build apk --release --flavor prod \
            --dart-define=CI_VERSION="$CI_VERSION" \
            --dart-define=GIT_COMMIT="$GIT_COMMIT" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beecount-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
