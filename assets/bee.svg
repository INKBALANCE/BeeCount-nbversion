<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!--
    记流水账 品牌图形（应用内单色版）
    ------------------------------------------------
    与桌面图标同一套 100 单位坐标（见 tool/personal/generate_icons.py）：
    上尖下圆的水滴 + 人民币符号。

    为什么做成"镂空"而不是直接画白色 ¥：
      本文件由 lib/pages/shared/branding/bee_artwork.dart 的 BeeIcon 使用，
      填充色取 currentColor（调用方传主题色）。各位置背景不同（关于页浅灰
      圆底、首页 header 渐变、分享海报纸白或深色），白色 ¥ 压在浅色主题色
      上会糊掉。镂空后 ¥ 露出的是背景本身，任何背景 / 亮暗主题 / 任意主题
      色都成立。

    实现：用 mask 把 ¥ 的笔画挖掉（mask 内白色保留、黑色挖空）。
    不用 fill-rule="evenodd"：¥ 的笔画彼此相交，even-odd 会让交叠处重新
    变实心，横竖交接处会冒出色块。
  -->
  <defs>
    <mask id="yuan-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <g stroke="#000000" stroke-width="5.6" stroke-linecap="butt" fill="none">
        <path d="M39 46L50 58M61 46L50 58"/>
        <path d="M50 57V78"/>
        <path d="M36 60H64M36 67H64"/>
      </g>
    </mask>
  </defs>
  <path d="M50 6C50 6 72 34 78 54A30 30 0 1 1 22 54C28 34 50 6 50 6Z"
        fill="currentColor" mask="url(#yuan-cutout)"/>
</svg>
